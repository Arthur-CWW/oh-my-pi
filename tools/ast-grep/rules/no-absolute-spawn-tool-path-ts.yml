id: no-absolute-spawn-tool-path-ts
language: TypeScript
files:
  - "vendor/oh-my-pi/packages/coding-agent/src/**/*.ts"
ignores:
  - "vendor/oh-my-pi/packages/coding-agent/src/resource/ps-command.ts"
message: "Resolve spawned tool executables through the shared process boundary instead of hardcoding Unix paths."
severity: error
note: |
  Use resource/ps-command.ts for PATH resolution. Absolute fallback candidates belong only in that boundary.
rule:
  all:
    - kind: string
    - regex: "^./(bin|usr/bin|sbin|usr/sbin)/"
    - inside:
        stopBy: neighbor
        all:
          - kind: array
          - inside:
              stopBy: neighbor
              all:
                - kind: pair
                - has:
                    field: key
                    regex: "^cmd$"
                - inside:
                    stopBy: end
                    any:
                      - pattern: "Bun.spawn($$$ARGS)"
                      - pattern: "Bun.spawnSync($$$ARGS)"
                      - pattern: "spawn($$$ARGS)"
