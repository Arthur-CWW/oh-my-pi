id: no-unsafe-any-unknown-ts
language: TypeScript
files:
  - "**/*.ts"
  - "**/*.tsx"
ignores:
  - "**/*.d.ts"
  - "**/*.gen.ts"
  - "**/*.gen.tsx"
  - "**/*.generated.ts"
  - "**/*.generated.tsx"
  - "**/generated/**"
  - "**/vendor/**"
  - "**/node_modules/**"
message: "Avoid explicit any/unknown outside typed boundary modules."
severity: error
note: |
  Core code should not pass around any/unknown. At HTTP/API/process boundaries,
  decode the raw value immediately (Effect Schema, Zod, valibot, io-ts, Pydantic,
  etc.) and return a named type. At DB boundaries, prefer generated/inferred query
  types, or decode rows in the repository layer.

  If this is truly boundary code, move it under a boundary path/name such as
  external/, clients/, db/, schemas/, *.boundary.ts, *.external.ts, or *.schema.ts.
  For a one-line escape hatch use `// ast-grep-ignore: no-unsafe-any-unknown-ts`
  with a justification in the neighboring comment.
rule:
  kind: predefined_type
  regex: "^(any|unknown)$"
