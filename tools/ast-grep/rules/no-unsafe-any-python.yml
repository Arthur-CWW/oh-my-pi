id: no-unsafe-any-python
language: Python
files:
  - "**/*.py"
ignores:
  - "**/*.gen.py"
  - "**/*.generated.py"
  - "**/generated/**"
  - "**/vendor/**"
  - "**/node_modules/**"
  # Boundary conventions: raw IO may enter here, but must be decoded before export.
  - "**/*.boundary.py"
  - "**/*.external.py"
  - "**/*.schema.py"
  - "**/*_boundary.py"
  - "**/*_external.py"
  - "**/*_schema.py"
  - "**/*_schemas.py"
  - "**/*_db.py"
  - "**/*_database.py"
  - "**/*_api.py"
  - "**/*_client.py"
  - "**/adapter/**"
  - "**/adapters/**"
  - "**/api/**"
  - "**/apis/**"
  - "**/boundaries/**"
  - "**/boundary/**"
  - "**/client/**"
  - "**/clients/**"
  - "**/data-access/**"
  - "**/data_access/**"
  - "**/database/**"
  - "**/db/**"
  - "**/external/**"
  - "**/schema/**"
  - "**/schemas/**"
message: "Avoid typing.Any/Unknown outside typed boundary modules."
severity: error
note: |
  Core Python code should not pass around Any/Unknown. At HTTP/API/process
  boundaries, decode the raw value immediately (Pydantic, attrs/cattrs,
  dataclasses plus validation, msgspec, typed-dicts with explicit validation,
  etc.) and return a named type. At DB boundaries, prefer libraries that infer row
  types, generated models, or decode rows in the repository layer.

  If this is truly boundary code, move it under a boundary path/name such as
  external/, clients/, db/, schemas/, *.boundary.py, *.external.py, or *_schema.py.
  For a one-line escape hatch use `# ast-grep-ignore: no-unsafe-any-python` with
  a justification in the neighboring comment.
rule:
  any:
    - kind: identifier
      regex: "^(Any|Unknown)$"
    - all:
        - kind: string_content
          regex: "(^|[^A-Za-z0-9_])(typing\\.Any|Any|Unknown)([^A-Za-z0-9_]|$)"
        - inside:
            kind: type
            stopBy: end
