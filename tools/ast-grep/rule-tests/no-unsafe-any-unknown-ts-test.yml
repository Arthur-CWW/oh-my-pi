id: no-unsafe-any-unknown-ts
valid:
  - "let value: string | number"
  - "type JsonScalar = string | number | boolean | null"
  - "const value = schema.decodeSync(input)"
invalid:
  - "let value: any"
  - "let value: unknown"
  - "const value = input as any"
  - "type Bag = Record<string, unknown>"
  - "function f<T = unknown>(value: T): T { return value }"
