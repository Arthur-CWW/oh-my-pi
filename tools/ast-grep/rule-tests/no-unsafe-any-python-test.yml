id: no-unsafe-any-python
valid:
  - "value: str | int"
  - "data: dict[str, str]"
  - "def parse_user(value: object) -> User: ..."
invalid:
  - "from typing import Any"
  - "value: Any"
  - "value: typing.Any"
  - "value: \"Any\""
  - "value: \"list[Any]\""
  - "def f(value: Any) -> Any: ..."
  - "value = cast(Any, raw)"
