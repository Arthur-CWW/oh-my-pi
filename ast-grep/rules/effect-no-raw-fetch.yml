id: effect-no-raw-fetch
message: Prefer Effect HttpClient or a dedicated transport service over raw fetch in Effect-owned code.
severity: warning
language: TypeScript
files:
  - src/effect/**/*.ts
  - packages/kagi/src/**/*.ts
ignores:
  - src/effect/test/**/*.ts
  - tests/**/*.ts
  - packages/legacy-web-access/**
  - '**/*test.ts'
rule:
  pattern: fetch($$$ARGS)
note: |
  Raw fetch in runtime/orchestration modules tends to leak transport details, retry policy, timeout
  policy, and response decoding into higher-level code. Prefer HttpClient-backed services when practical.
metadata:
  category: effect-slop
  rationale: transport-boundary
