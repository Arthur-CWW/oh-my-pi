id: effect-no-raw-json-cast
message: Decode external JSON with Schema instead of raw casts.
severity: warning
language: TypeScript
files:
  - src/effect/**/*.ts
  - packages/kagi/src/**/*.ts
ignores:
  - src/effect/test/**/*.ts
  - tests/**/*.ts
  - packages/legacy-web-access/**
  - '**/*test.ts'
rule:
  any:
    - pattern: $RESPONSE.json() as Promise<$TYPE>
    - pattern: (await $RESPONSE.json()) as $TYPE
note: |
  At HTTP/JSON boundaries, prefer Schema decoding so malformed third-party payloads fail loudly and
  predictably instead of leaking unchecked casts into the runtime.
metadata:
  category: effect-slop
  rationale: schema-first-boundary
