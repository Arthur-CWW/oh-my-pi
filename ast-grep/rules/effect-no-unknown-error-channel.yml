id: effect-no-unknown-error-channel
message: Avoid `unknown` in Effect error channels; use tagged/provider-specific errors.
severity: warning
language: TypeScript
files:
  - src/effect/**/*.ts
  - packages/kagi/src/**/*.ts
ignores:
  - src/effect/test/**/*.ts
  - tests/**/*.ts
  - packages/legacy-web-access/**
  - '**/*test.ts'
rule:
  any:
    - pattern:
        context: type T = Effect.Effect<$VALUE, unknown>
        selector: generic_type
    - pattern:
        context: type T = Effect.Effect<$VALUE, unknown, $R>
        selector: generic_type
    - pattern:
        context: type T = Effect.fn.Return<$VALUE, unknown>
        selector: generic_type
    - pattern:
        context: type T = Effect.fn.Return<$VALUE, unknown, $R>
        selector: generic_type
note: |
  `unknown` in internal Effect deps usually forces broad catch-all recovery and leaks provider/runtime
  meaning. Prefer typed errors and `catchTag`/`catchTags` where possible.
metadata:
  category: effect-slop
  rationale: typed-errors
