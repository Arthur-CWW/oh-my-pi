id: effect-no-fail-open-catch-null
message: Don't broadly catch all errors to `null`; use typed recovery or a named fail-open adapter.
severity: warning
language: TypeScript
files:
  - src/effect/**/*.ts
  - packages/kagi/src/**/*.ts
ignores:
  - src/effect/test/**/*.ts
  - tests/**/*.ts
  - packages/legacy-web-access/**
  - '**/*test.ts'
rule:
  any:
    - pattern: Effect.catch(() => Effect.succeed(null))
    - pattern: Effect.catch(($ERROR) => Effect.succeed(null))
    - pattern: Effect.catch(() => Effect.succeed<$TYPE>(null))
    - pattern: Effect.catch(($ERROR) => Effect.succeed<$TYPE>(null))
note: |
  If fail-open behavior is intended, centralize it behind a named provider/service API instead of
  duplicating broad `catch(...)->null` logic at call sites.
metadata:
  category: effect-slop
  rationale: explicit-fail-open
