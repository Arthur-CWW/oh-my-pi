id: effect-no-return-null
message: Review `return null` in Effect code; prefer typed failures internally unless null truly means unavailable/not-applicable.
severity: info
language: TypeScript
files:
  - src/effect/**/*.ts
  - packages/kagi/src/**/*.ts
ignores:
  - src/effect/test/**/*.ts
  - tests/**/*.ts
  - packages/legacy-web-access/**
  - '**/*test.ts'
rule:
  pattern: return null
note: |
  `null` is acceptable at explicit compatibility or availability boundaries, but it should not be the
  default internal operational failure channel.
metadata:
  category: effect-slop
  rationale: distinguish-unavailable-vs-failed
