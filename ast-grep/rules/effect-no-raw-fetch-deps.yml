id: effect-no-raw-fetch-deps
message: Don't expose raw fetch/Response in internal deps; use HttpClient or a typed service boundary.
severity: warning
language: TypeScript
files:
  - src/effect/**/*.ts
  - packages/kagi/src/**/*.ts
ignores:
  - src/effect/test/**/*.ts
  - tests/**/*.ts
  - packages/legacy-web-access/**
  - '**/*test.ts'
rule:
  pattern:
    context: 'interface X { readonly fetch: ($$$ARGS) => Promise<Response>; }'
    selector: property_signature
note: |
  Internal orchestrators should not need to know about raw fetch signatures. Prefer a service that
  returns typed domain/transport results instead of Promise<Response>.
metadata:
  category: effect-slop
  rationale: transport-boundary
