id: effect-no-json-parse
message: Prefer Effect Schema / Config boundaries over raw JSON.parse in Effect-owned code.
severity: warning
language: TypeScript
files:
  - src/effect/**/*.ts
  - packages/kagi/src/**/*.ts
ignores:
  - src/effect/test/**/*.ts
  - tests/**/*.ts
  - packages/legacy-web-access/**
  - '**/*test.ts'
rule:
  pattern: JSON.parse($INPUT)
note: |
  Raw JSON.parse is a common migration smell in this repo. Prefer Schema decoding or Effect Config/
  ConfigProvider at the boundary instead of ad-hoc parsing inside Effect runtime code.
metadata:
  category: effect-slop
  rationale: schema-first-boundary
