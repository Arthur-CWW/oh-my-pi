[project]
name = "tweet-hydrator"
version = "0.1.0"
description = "Pipeline for hydrating archived tweets into the tweet-archives SQLite database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.10",
  "aiosqlite>=0.20",
  "beautifulsoup4>=4.12",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12"
]

[project.scripts]
tweet-hydrator = "tweet_hydrator.cli:app"

[project.optional-dependencies]
test = ["pytest>=8.3"]
