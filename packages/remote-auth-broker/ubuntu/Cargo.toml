[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/verifier-core",
    "crates/gdm-daemon",
    "crates/gdm-ingest",
    "crates/pam-gdm-broker",
    "crates/sudo-daemon",
    "crates/sudo-ingest",
    "crates/verifierctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.1.1"
getrandom = "=0.2.17"
hex = "=0.4.3"
hpke = { version = "=0.12.0", default-features = false, features = ["alloc", "x25519"] }
libc = "=0.2.189"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = { version = "=1.8.1", features = ["derive"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
