[package]
name = "symphony-lite-rs"
version = "0.1.0"
edition = "2021"
description = "SymphonyX local-first agent orchestration runner"

[[bin]]
name = "symphonyx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
insta = { version = "1.42", features = ["json"] }
tempfile = "3.10"
