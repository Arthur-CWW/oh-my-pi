# Stream service registry for scripts/streams.ts.
# External live routes hsk-reader and mochi-lite are intentionally not registered:
# their repositories live outside ~/agents, while this registry requires a
# repo-relative cwd and a command owned by this tree. hsk-component is an ad-hoc
# /tmp static server; primer-qa* are aliases/test instances owned by
# primer-daemon without independent single dev commands.
streams:
  companion:
    review:
      - name: Companion motion lab
        url: https://companion.localhost/lab
    services:
      portless-proxy:
        cwd: .
        cmd: status="$($(mise which node) $(mise which portless) service status)" && case "$status" in *"Proxy on "*":"[[:space:]]*"responding"*) exec tail -f /dev/null ;; *) exit 1 ;; esac
        shared: true
        health:
          command: status="$($(mise which node) $(mise which portless) service status)" && case "$status" in *"Proxy on "*":"[[:space:]]*"responding"*) exit 0 ;; *) exit 1 ;; esac
          timeoutSec: 20
      kokoro-tts:
        cwd: apps/ai-companion-rtc
        cmd: uv run scripts/tts-sidecar.py --port 8799
        dependsOn: [portless-proxy]
        health:
          url: http://127.0.0.1:8799/health
          timeoutSec: 120
      parakeet-stt:
        cwd: apps/ai-companion-rtc
        cmd: uv run scripts/stt-sidecar.py --port 8798
        dependsOn: [portless-proxy]
        health:
          url: http://127.0.0.1:8798/health
          timeoutSec: 120
      xanadu:
        cwd: apps/xanadu
        cmd: PORT=4970 bun run serve
        dependsOn: [portless-proxy]
        health:
          url: http://127.0.0.1:4970/api/feed
          timeoutSec: 60
      companion-server:
        cwd: apps/ai-companion-rtc
        cmd: bun run src/server.ts
        env:
          AI_COMPANION_TTS: kokoro
          AI_COMPANION_LLM: omp
          AI_COMPANION_TTS_URL: http://127.0.0.1:8799
          AI_COMPANION_STT_URL: http://127.0.0.1:8798
          AI_COMPANION_XANADU_URL: http://127.0.0.1:4970
          AI_COMPANION_PORT: "4897"
        dependsOn: [kokoro-tts, parakeet-stt, xanadu]
        health:
          url: http://127.0.0.1:4897/
          timeoutSec: 60
      motion-oracle:
        cwd: apps/ai-companion-rtc
        cmd: bun run oracle:motion:run -- --host 127.0.0.1 --port 49982
        dependsOn: [companion-server]
        health:
          command: lsof -nP -iUDP:49982 | grep -q AppleMoti
          timeoutSec: 30
  primer:
    review:
      - name: Primer inbox
        url: https://primer.localhost/#/inbox
      - name: Meltdown reader
        url: https://meltdown.localhost/
    services:
      portless-proxy:
        cwd: .
        cmd: status="$($(mise which node) $(mise which portless) service status)" && case "$status" in *"Proxy on "*":"[[:space:]]*"responding"*) exec tail -f /dev/null ;; *) exit 1 ;; esac
        shared: true
        health:
          command: status="$($(mise which node) $(mise which portless) service status)" && case "$status" in *"Proxy on "*":"[[:space:]]*"responding"*) exit 0 ;; *) exit 1 ;; esac
          timeoutSec: 20
      primer-daemon:
        cwd: packages/primer-daemon
        cmd: bun run dev
        dependsOn: [portless-proxy]
        health:
          command: curl -sk -m 3 -o /dev/null -w '%{http_code}' https://primer.localhost/ | grep -qx 200
          timeoutSec: 120
      meltdown:
        cwd: streams/primer/wrapped-commentary-reader
        cmd: bun run dev:up
        dependsOn: [portless-proxy]
        health:
          command: curl -sk -m 3 -o /dev/null -w '%{http_code}' https://meltdown.localhost/api/health | grep -qx 200
          timeoutSec: 120
  playground:
    review:
      - name: Scene playground
        url: https://scene.localhost/
    services:
      portless-proxy:
        cwd: .
        cmd: status="$($(mise which node) $(mise which portless) service status)" && case "$status" in *"Proxy on "*":"[[:space:]]*"responding"*) exec tail -f /dev/null ;; *) exit 1 ;; esac
        shared: true
        health:
          command: status="$($(mise which node) $(mise which portless) service status)" && case "$status" in *"Proxy on "*":"[[:space:]]*"responding"*) exit 0 ;; *) exit 1 ;; esac
          timeoutSec: 20
      scene:
        cwd: apps/scene-playground
        cmd: bun run dev
        dependsOn: [portless-proxy]
        health:
          url: https://scene.localhost/healthz
          timeoutSec: 60
  anichat-motion-lab:
    review:
      - name: AniChat motion lab
        url: https://anichat-motion-lab.localhost/
    services:
      portless-proxy:
        cwd: .
        cmd: status="$($(mise which node) $(mise which portless) service status)" && case "$status" in *"Proxy on "*":"[[:space:]]*"responding"*) exec tail -f /dev/null ;; *) exit 1 ;; esac
        shared: true
        health:
          command: status="$($(mise which node) $(mise which portless) service status)" && case "$status" in *"Proxy on "*":"[[:space:]]*"responding"*) exit 0 ;; *) exit 1 ;; esac
          timeoutSec: 20
      anichat-motion-lab:
        cwd: packages/anichat-motion-lab
        cmd: bunx portless anichat-motion-lab bun --watch src/server.ts
        dependsOn: [portless-proxy]
        health:
          url: https://anichat-motion-lab.localhost/
          timeoutSec: 60
  video-eval:
    review:
      - name: Video evaluation viewer
        url: http://127.0.0.1:4933/
    services:
      video-eval:
        cwd: packages/video-eval-viewer
        cmd: bun run dev
        env:
          PORT: "4933"
        health:
          url: http://127.0.0.1:4933/
          timeoutSec: 30
  harness:
    review:
      - name: Fleet board
        url: https://fleet-board.localhost/
    services:
      fleet-observer:
        cwd: packages/fleet-observer
        cmd: bun run observe -- --loop
        env:
          OMP_BIN: omp
          # smol lane per ~/.omp/agent/config.yml roles.smol — NEVER terra (banned, Arthur 2026-07-15)
          OBSERVER_MODEL: openai-codex/gpt-5.6-luna:xhigh
          OBSERVER_THRESHOLD_BYTES: "65536"
          OBSERVER_INTERVAL_SECONDS: "120"
        health:
          # Loop liveness: heartbeat file stamped each pass; stale >6min (3x interval) = down.
          command: test -n "$(find data/fleet-observer/heartbeat -mmin -6 2>/dev/null)"
          timeoutSec: 10
      fleet-board:
        cwd: packages/fleet-board
        cmd: bun run dev
        env:
          OMP_BIN: omp
        health:
          # portless terminates TLS; plain-http hostname probe returns empty here, so curl -k the https name.
          command: curl -sk -m 3 https://fleet-board.localhost/healthz | grep -qx ok
          timeoutSec: 15
