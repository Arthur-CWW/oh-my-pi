schemaVersion: 1
updated: 2026-07-03
revised: 2026-07-20
currentAuthority: docs/fable/federated-control-plane.md
# --- 2026-07-20 authority + scope note -----------------------------------------
# Fleet topology and control-plane ARCHITECTURE are owned by currentAuthority
# (docs/fable/federated-control-plane.md): federated per-host workspace manifests (§7),
# derived global cross-workspace views (§6/§10), and NO shared mutable filesystem (§3).
# This file is NOT a competing topology authority. It is a host-local (Mac cockpit)
# AVAILABILITY catalog of that host's workspace/context roots. Cross-host reach is
# federated over the server API + tailnet, never a shared mount; any global
# cross-workspace view is a derived projection, not this flat registry. Where this file
# and the federated doc conflict, the federated doc wins; superseded framing below is
# dated-marked (2026-07-20), not silently rewritten. Original registry design: 2026-07-03.
purpose: >-
  Host-local (Mac cockpit) workspace and context-root availability catalog. Folders
  express ownership; this catalog expresses availability, task context, and safe
  cross-workspace handoff on this host. Fleet topology and control-plane architecture
  are owned by currentAuthority; this file is not a fleet-topology authority.

principles:
  - canonical_location_follows_ownership
  - availability_follows_config
  - cross_cutting_meaning_follows_tags_and_indexes
  - implementation_transfer_follows_packets
  - session_continuity_follows_stable_ids_and_path_aliases
  - scheduling_state_follows_sqlite_ledgers

homeRoots:
  agents:
    path: /Users/arthur/agents
    kind: agent-control-plane
    owns:
      - OMP/Pi/Codex/Hermes extensions and tools
      - reusable first-party skills
      - reusable workflows and local agent apps while co-evolving
    tags: [agents, omp, pi, skills, extensions, workflows]
  products:
    path: /Users/arthur/products
    kind: product-workspace
    owns:
      - shipped or product-shaped apps and worktrees
    tags: [products]
  exploratory:
    path: /Users/arthur/exploratory
    kind: research-workspace
    owns:
      - research
      - prototypes
      - reveng evidence
      - notebooks
    tags: [research, prototypes, reveng]
  vault:
    path: /Users/arthur/vault
    kind: knowledge-vault
    owns:
      - durable notes
      - source clippings
      - indexes
      - promote workbench
    tags: [vault, knowledge, index]
  state:
    path: /Users/arthur/state
    kind: runtime-state
    owns:
      - generated databases
      - audits
      - migration/session repair artifacts
      - control-plane SQLite ledgers and generated task metadata indexes
    tags: [state, generated, sessions]

repoRoots:
  skills:
    path: /Users/arthur/agents/skills
    kind: first-party-skills
    rule: direct skills live one level below each domain parent
    discoveryParents:
      - /Users/arthur/agents/skills/core
      - /Users/arthur/agents/skills/browser
      - /Users/arthur/agents/skills/provider
      - /Users/arthur/agents/skills/research
      - /Users/arthur/agents/skills/design
      - /Users/arthur/agents/skills/media
  vendoredPiSkills:
    path: /Users/arthur/agents/vendor/badlogic/pi-skills
    kind: vendored-skills
    discoveryParents:
      - /Users/arthur/agents/vendor/badlogic/pi-skills
  extensions:
    path: /Users/arthur/agents/packages
    kind: extension-packages
    activeEntrypoints:
      - /Users/arthur/agents/packages/web-access/src/index.ts
      - /Users/arthur/agents/packages/mermaid-preview/src/index.ts
      - /Users/arthur/agents/packages/browser-use/index.ts
      - /Users/arthur/agents/packages/stema/src/index.ts
  workflows:
    path: /Users/arthur/agents/workflows
    kind: workflow-definitions
  streams:
    path: /Users/arthur/agents/streams
    kind: stream-charters
    rule: >-
      one dir per Fable stream (companion, playground, primer, harness); GOAL.md is the
      session contract (goal, NFRs, owner paths, exclusions, open questions). Shared
      context is docs/fable/charter.md + docs/state/creative-framing.md; sharded
      sessions read charter -> streams/<x>/GOAL.md per docs/fable/handoff.md.
    tags: [agents, fable, streams, ownership]
  vendor:
    path: /Users/arthur/agents/vendor
    kind: vendored-source
    rule: reference/imported source; do not auto-load unless listed explicitly
  ohMyPiFork:
    # 2026-07-22: relocated off the dead repo-root path /Users/arthur/agents/oh-my-pi.
    # `~/agents` is the canonical control-plane workspace (federated-control-plane.md §7);
    # the OMP fork is now a no-I/O `policy: pin` vendored checkout, not a first-class
    # repo-root fork.
    path: /Users/arthur/agents/vendor/oh-my-pi
    kind: vendored-fork-pinned
    rule: pinned vendored OMP fork (vendor-sync policy:pin, no auto-I/O); do not auto-load unless listed explicitly
  # 2026-07-22: `openDesign` repoRoot removed. Its vendored source
  # /Users/arthur/agents/vendor/nexu-io--open-design no longer exists, and its pinned
  # sourceCommit/syncDate snapshot assumption is dead (removed alongside the NCode /
  # Open-Design snapshots). Any local-first run data (state/open-design, OD_DATA_DIR) is
  # runtime state under the `state` home root, not a vendored source root.

adHocContextPolicy:
  default: add_absolute_path_here_or_in_project_packet_before_moving_files
  rules:
    - Do not move a folder into agents only to make it visible to agents.
    - Prefer absolute path references, OMP customDirectories, or packet links.
    - Promote to agents only when the artifact becomes reusable agent capability.
    - Promote to products only when it becomes product implementation.
    - Keep raw reveng evidence in exploratory or a dedicated RevEng root.

contextRoots:
  # Add temporary cross-workspace context roots here when a task needs nearby access.
  # A future session-remap/catalog tool should read these and expose them to agents.
  - id: home-workspace-index
    path: /Users/arthur/WORKSPACE_INDEX.md
    kind: workspace-index
    tags: [ontology, lifecycle-roots]
  - id: home-workspace-db
    path: /Users/arthur/workspace.sqlite
    kind: workspace-index-db
    tags: [ontology, lifecycle-roots]
  - id: voiceink-product-source
    path: /Users/arthur/products/VoiceInk
    kind: product-source
    tags: [products, voiceink, source]
  - id: voiceink-runtime-state
    path: /Users/arthur/state/voiceink
    kind: runtime-state
    tags: [state, voiceink, runtime, recovery, backups]

  # 2026-07-22: former `agents-control-plane-ledger` path /Users/arthur/agents/data/symphony-lite
  # is dead. Canonical queue/attention/routing/claims ledger authority is the control-plane
  # package (federated-control-plane.md §2); editorial task intake is TASKS.md + the harness
  # register. The symphony-lite task-ledger design (see packetPolicy.taskLedger) is historical.
  - id: agents-control-plane
    path: /Users/arthur/agents/packages/control-plane
    kind: control-plane-package
    tags: [agents, control-plane, sqlite, ledger]
  - id: pi-cockpit-ledger
    path: /Users/arthur/.local/share/pi-cockpit/cockpit.sqlite
    kind: cockpit-runtime-db
    tags: [agents, cockpit, sqlite, runtime-state]
  - id: asmr-companion-goal6-proof
    path: /Users/arthur/agents/docs/qa/asmr-companion-goal6-final-handoff-20260624.md
    kind: proof-handoff
    tags: [agents, asmr, seedance, proof, commit-cacf7653]
  - id: asmr-companion-goal6-inventory
    path: /Users/arthur/agents/docs/qa/asmr-companion-goal6-artifact-inventory-20260624.json
    kind: proof-inventory
    tags: [agents, asmr, seedance, proof, commit-cacf7653]

packetPolicy:
  rootCandidates:
    # 2026-07-22: dead paths /Users/arthur/exploratory/packets and /Users/arthur/vault/promote
    # removed; extant candidates only.
    - /Users/arthur/agents/docs/provider
    - /Users/arthur/agents/docs/plans
  requiredFields:
    - id
    - ownerRoot
    - consumerRoot
    - evidenceLinks
    - cleanRoomBoundary
    - implementationTargets
    - acceptanceChecks
    - proofLinks
  taskLedger:
    # 2026-07-22 SUPERSEDED (historical design intent). The symphony-lite task-ledger is
    # not the current canonical task/queue authority: per federated-control-plane.md §2,
    # canonical queue/attention/routing/claims = the control-plane SQLite ledger
    # (packages/control-plane) and editorial task intake = TASKS.md + the harness register.
    # Kept only to date the original design; canonicalRuntimeRoot below is a DEAD path.
    sourceOfTruth: sqlite-after-import
    canonicalRuntimeRoot: /Users/arthur/agents/data/symphony-lite   # DEAD 2026-07-22; superseded by packages/control-plane (federated §2)
    firstImplementationTarget: /Users/arthur/agents/packages/symphony-lite-elixir
    markdownRole: policy-and-human-summary
    migrationSources:
      - TASKS.md
      - packet manifests under packetPolicy.rootCandidates
      - domain SQLite packet ledgers when an adapter exists
    minimalTables:
      - task_packets
      - packet_ownership
      - packet_proofs
      - packet_events

sessionContinuity:
  # 2026-07-22 SUPERSEDED framing. Durable session identity, stable URIs, and per-host
  # workspace binding are now owned by federated-control-plane.md §6 (full internal ID +
  # stable 12-char alias + workspace://, session://, doc://, task://, artifact:// resolvers)
  # and §7 (host-local workspace manifests). The "future session-remap/catalog tool" below
  # is the derived cross-client reference resolver (research-register RR-004). Retained as
  # dated 2026-07-03 framing of the original cwd-keyed problem, not current architecture.
  problem: current agent sessions are keyed primarily by cwd path
  targetIdentity:
    - workspaceId
    - packetId_or_taskId
    - pathAliases
  mitigation:
    - record old and new paths before moving workspaces
    - repair OMP/Pi/Codex session metadata with a reusable session-remap tool
    - keep path aliases in /Users/arthur/WORKSPACE_INDEX.md or workspace.sqlite
