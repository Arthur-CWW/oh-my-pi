# Primer stream session overlay.
# Use with: omp --config ./.omp/primer-config.yml
# Orchestration defaults to Fable MEDIUM (Arthur, 2026-07-03) — never default
# above :medium; pass --model ...:high explicitly only when truly needed.
# Starts from ./.omp/fable-config.yml and adds primer-local skills.

model: anthropic/claude-fable-5:medium

modelRoles:
  # INTERIM ROUTING (Arthur, 2026-07-09): OpenAI account down (Pro degraded to
  # free, case 11129100 escalated) — all GPT-5.5 worker lanes moved to Opus,
  # mostly 4.8, as the hands. Revert to GPT-5.5 when the account recovers.
  # Kimi stays only for refusal-basin feedstock retrieval (books/resources)
  # via research/authenticated_web.
  smol: anthropic/claude-opus-4-8:low
  task: anthropic/claude-opus-4-8:medium
  implementer: anthropic/claude-opus-4-8:high
  maintenance: anthropic/claude-opus-4-8:low
  research: kimi-code/kimi-for-coding
  authenticated_web: kimi-code/kimi-for-coding
  complex: anthropic/claude-opus-4-8:high
  plan: anthropic/claude-opus-4-8:high
  slow: anthropic/claude-opus-4-8:high
  designer: anthropic/claude-opus-4-8
  # Cheap vision for inspect_image (Arthur, 2026-07-03): image inspection was
  # silently routed to the session model (Fable) — pi/vision wins the
  # resolution order, so pin it to the Antigravity Gemini flash lane.
  vision: google-antigravity/gemini-3.5-flash-low

advisor:
  enabled: true
  scope: subagents
  model: deepseek/deepseek-reasoner-v4

auth:
  codexRefresh: manual

task:
  enableLsp: true
  eager: always
  maxRecursionDepth: -1
  softRequestBudget: 40
  isolation:
    mode: apfs

providers:
  webSearch: kagi

autolearn:
  enabled: false

skills:
  customDirectories:
    - ./streams/harness/skills
    - ./streams/primer/skills
