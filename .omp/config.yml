setupVersion: 1
modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  smol: openai-codex/gpt-5.6-luna:xhigh
  research: openai-codex/gpt-5.6-luna:xhigh
  authenticated_web: openai-codex/gpt-5.6-luna:xhigh
  maintenance: anthropic/claude-opus-4-8:high
  advisor: anthropic/claude-opus-4-8:high
  plan: anthropic/claude-opus-4-8:high
  slow: anthropic/claude-opus-4-8:high
  designer: anthropic/claude-opus-4-8:high
  vision: openai-codex/gpt-5.6-luna
  implementer: anthropic/claude-opus-4-8:high
  qa: openai-codex/gpt-5.6-luna:xhigh
  operator: anthropic/claude-opus-4-8:high
  synthesizer: anthropic/claude-opus-4-8:high
  task: anthropic/claude-opus-4-8:high
extensions:
  - /Users/arthur/agents/packages/web-access/src/index.ts
  - /Users/arthur/.omp/agent/extensions/cmux-omp-session.ts
  - /Users/arthur/agents/packages/control-plane
  - /Users/arthur/agents/packages/computer-use-bridge
  - /Users/arthur/agents/packages/ast-grep-guard
  - /Users/arthur/agents/packages/mermaid-preview
  - /Users/arthur/agents/packages/browser-use
  - /Users/arthur/agents/packages/stema
  - /Users/arthur/agents/packages/device-control
  - /Users/arthur/agents/extensions/browser-automation-guard.ts
skills:
  ignoredSkills:
    - computer-use
    - gmcli
    - orca-cli
    - orchestration
  customDirectories:
    - /Users/arthur/agents/skills/browser
    - /Users/arthur/agents/skills/core
    - /Users/arthur/agents/skills/fleet
    - /Users/arthur/agents/vendor/badlogic/pi-skills
    - /Users/arthur/agents/packages/stema/skills
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
serviceTier: none
auth:
  codexUsageReset: manual
codexResets:
  autoRedeem: "no"
hideThinkingBlock: false
doubleEscapeAction: tree
power:
  sleepPrevention: system
renderMermaid:
  enabled: true
inspect_image:
  enabled: true
task:
  eager: always
  enableLsp: true
  maxConcurrency: 8
  maxLiveChildren: 6
  isolation:
    mode: apfs
  softRequestBudget: 80
  showResolvedModelBadge: true
  maxRecursionDepth: 3
  agentModelOverrides:
    explore: openai-codex/gpt-5.6-luna:xhigh
    librarian: openai-codex/gpt-5.6-luna:xhigh
    reviewer: openai-codex/gpt-5.6-luna:xhigh
  orchestratorOnlyModels:
    - "*fable*"
    - "*haiku*"
  autoqa:
    consent: granted
  disabledAgents:
    - operator
browser:
  maxTabsPerSession: 2
quotaAdmission:
  enabled: false
providers:
  webSearch: kagi
github:
  enabled: true
vault:
  enabled: true
theme:
  light: light-solarized
  dark: dark-gruvbox
colorBlindMode: true
display:
  showTokenUsage: true
images:
  blockImages: false
editor:
  vim: true
steeringMode: all
disabledProviders:
  - moonshot
advisor:
  enabled: false
  syncBacklog: "off"
  subagents: true
symbolPreset: nerd
statusLine:
  preset: compact
  separator: powerline-thin
autolearn:
  enabled: false
compaction:
  enabled: true
  strategy: context-full
  thresholdPercent: -1
  thresholdTokens: -1
  remoteEnabled: true
  keepRecentTokens: 20000
  reserveTokens: 16384
  autoContinue: true
interruptMode: immediate
defaultThinkingLevel: auto
dev:
  autoqa:
    consent: denied
