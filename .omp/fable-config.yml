# Sol high owns load-bearing orchestration and implementation. Luna xhigh is
# reserved for smol, simple, peripheral work. Designer and vision stay explicit.
# Use with: omp --config ./.omp/fable-config.yml
model: openai-codex/gpt-5.6-sol:high

modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  smol: openai-codex/gpt-5.6-luna:xhigh
  task: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  advisor: openai-codex/gpt-5.6-sol:high
  designer: anthropic/claude-opus-4-6
  vision: google-antigravity/gemini-3.5-flash

# Failing subagents may propose these chains; the parent must explicitly approve
# every switch. Main/orchestrator sessions never auto-apply them.
retry:
  fallbackApproval: true
  fallbackRevertPolicy: cooldown-expiry
  # Temporary quota-exhaustion posture: subagents only. Delete or move this
  # timestamp into the past to restore approval round-trips.
  subagentFallbackAutoApproveUntil: "2026-07-15T03:48:04Z"
  proposableFallbackChains:
    task:
      - kimi-code/kimi-for-coding
    smol:
      - openai-codex/gpt-5.6-sol:high
      - kimi-code/kimi-for-coding
    designer:
      - kimi-code/kimi-for-coding
      - openai-codex/gpt-5.6-sol:high

advisor:
  enabled: false
  scope: subagents
  model: openai-codex/gpt-5.6-sol:high

serviceTier: none
auth:
  codexRefresh: manual
  codexUsageReset: manual

# New runtime master gate plus the installed runtime's existing policy key.
# Keeping both manual/no prevents saved-reset redemption across the cutover.
codexResets:
  autoRedeem: "no"

task:
  enableLsp: true
  eager: always
  maxRecursionDepth: -1
  softRequestBudget: 80
  orchestratorOnlyModels:
    - "*fable*"
  isolation:
    mode: apfs

providers:
  webSearch: kagi

autolearn:
  enabled: false


skills:
  ignoredSkills:
    - gmcli
  customDirectories:
    - ./streams/harness/skills
    - ./skills/fleet
