# Sol high owns load-bearing orchestration and implementation. Luna xhigh is
# reserved for smol, simple, peripheral work. Designer and vision stay explicit.
# Use with: omp --config ./.omp/fable-config.yml
model: openai-codex/gpt-5.6-sol:high

modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  smol: openai-codex/gpt-5.6-luna:xhigh
  task: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  advisor: openai-codex/gpt-5.6-sol:high
  designer: anthropic/claude-opus-4-6
  vision: google-antigravity/gemini-3.5-flash-low

# Retry chains are restricted to built-in model roles.
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    smol:
      - openai-codex/gpt-5.6-sol:high
      - kimi-code/kimi-for-coding
    designer:
      - openai-codex/gpt-5.6-sol:high
    vision:
      - kimi-code/kimi-for-coding

advisor:
  enabled: false
  scope: subagents
  model: openai-codex/gpt-5.6-sol:high

serviceTier: none
auth:
  codexRefresh: manual

task:
  enableLsp: true
  eager: always
  maxRecursionDepth: -1
  softRequestBudget: 80
  orchestratorOnlyModels:
    - "*fable*"
  isolation:
    mode: apfs

providers:
  webSearch: kagi

autolearn:
  enabled: false


skills:
  customDirectories:
    - ./streams/harness/skills
