# Fable session overlay.
# Use with: omp --config ./.omp/fable-config.yml
# Orchestration defaults to Fable MEDIUM (Arthur, 2026-07-03): the orchestrator
# routes and gates, it doesn't think hard — never default above :medium.
# Pass --model anthropic/claude-fable-5:high explicitly only when a session
# genuinely needs it.

model: anthropic/claude-fable-5:medium

modelRoles:
  # GPT-5.5 medium = small/bounded tasks; :high = harder work.
  # Kimi is NOT a default worker (subscription likely cancelled): keep it only
  # for refusal-basin feedstock retrieval (books/resources GPT declines) via
  # research/authenticated_web, with GPT fallback chains covering outages.
  smol: openai-codex/gpt-5.5:medium
  task: openai-codex/gpt-5.5:medium
  implementer: openai-codex/gpt-5.5:high
  maintenance: openai-codex/gpt-5.5:medium
  research: kimi-code/kimi-for-coding
  authenticated_web: kimi-code/kimi-for-coding
  complex: openai-codex/gpt-5.5:high
  plan: openai-codex/gpt-5.5:high
  slow: openai-codex/gpt-5.5:high
  designer: anthropic/claude-opus-4-6
  # Cheap vision for inspect_image (Arthur, 2026-07-03): image inspection was
  # silently routed to the session model (Fable) — pi/vision wins the
  # resolution order, so pin it to the Antigravity Gemini flash lane.
  vision: google-antigravity/gemini-3.5-flash-low

# Subscription-quota failover (Arthur, 2026-07-07): when a lane's usage limit
# is exhausted mid-turn, the session falls back down the chain for that role
# (retry.fallbackChains keys are modelRoles names; runtime path:
# #handleRetryableError → isUsageLimitError → credential rotation → chain).
# Reverts to the primary when the suppression cooldown expires.
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    task:
      - kimi-code/kimi-for-coding
      - google-antigravity/gemini-3.5-flash
    smol:
      - google-antigravity/gemini-3.5-flash
      - kimi-code/kimi-for-coding
    implementer:
      - kimi-code/kimi-for-coding
    complex:
      - kimi-code/kimi-for-coding
    plan:
      - kimi-code/kimi-for-coding
    slow:
      - kimi-code/kimi-for-coding
    research:
      - openai-codex/gpt-5.5:medium
    authenticated_web:
      - openai-codex/gpt-5.5:medium
    designer:
      - openai-codex/gpt-5.5:high
    vision:
      - kimi-code/kimi-for-coding

advisor:
  enabled: true
  scope: subagents
  model: deepseek/deepseek-reasoner-v4

auth:
  codexRefresh: manual

task:
  enableLsp: true
  eager: always
  maxRecursionDepth: -1
  softRequestBudget: 80
  isolation:
    mode: apfs

providers:
  webSearch: kagi

autolearn:
  enabled: false


skills:
  customDirectories:
    - ./streams/harness/skills