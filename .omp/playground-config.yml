# Playground stream session overlay.
# Use with: omp --config ./.omp/playground-config.yml
# Adds playground-local skills.

model: openai-codex/gpt-5.6-sol:high
serviceTier: none

modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  smol: openai-codex/gpt-5.6-luna:xhigh
  task: openai-codex/gpt-5.6-luna:xhigh
  slow: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  advisor: openai-codex/gpt-5.6-sol:high
  designer: anthropic/claude-opus-4-6
  # inspect_image uses this provider-qualified capability role strictly.
  vision: google-antigravity/gemini-3.5-flash

advisor:
  enabled: true
  subagents: true
auth:
  codexRefresh: manual

task:
  enableLsp: true
  eager: always
  maxRecursionDepth: -1
  softRequestBudget: 40
  isolation:
    mode: apfs

providers:
  webSearch: kagi

autolearn:
  enabled: false

skills:
  ignoredSkills:
    - gmcli
  customDirectories:
    - ./streams/harness/skills
    - ./skills/fleet
    - ./streams/playground/skills
