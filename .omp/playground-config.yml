# Playground stream session overlay.
# Use with: omp --config ./.omp/playground-config.yml
# Starts from ./.omp/fable-config.yml and adds playground-local skills.
# Orchestration defaults to Fable MEDIUM (Arthur, 2026-07-03) — never default
# above :medium; pass --model ...:high explicitly only when truly needed.

model: anthropic/claude-fable-5:medium

modelRoles:
  # GPT-5.5 medium = small/bounded tasks; :high = harder work.
  # Kimi is NOT a default worker (subscription likely cancelled): keep it only
  # for refusal-basin feedstock retrieval (books/resources GPT declines) via
  # research/authenticated_web, with GPT fallback chains covering outages.
  smol: openai-codex/gpt-5.5:medium
  task: openai-codex/gpt-5.5:medium
  implementer: openai-codex/gpt-5.5:high
  maintenance: openai-codex/gpt-5.5:medium
  research: kimi-code/kimi-for-coding
  authenticated_web: kimi-code/kimi-for-coding
  complex: openai-codex/gpt-5.5:high
  plan: openai-codex/gpt-5.5:high
  slow: openai-codex/gpt-5.5:high
  designer: anthropic/claude-opus-4-6

advisor:
  enabled: true
  scope: subagents
  model: deepseek/deepseek-reasoner-v4

auth:
  codexRefresh: manual

task:
  enableLsp: true
  eager: always
  maxRecursionDepth: -1
  softRequestBudget: 40
  isolation:
    mode: apfs

providers:
  webSearch: kagi

autolearn:
  enabled: false

skills:
  customDirectories:
    - ./streams/harness/skills
    - ./streams/playground/skills
