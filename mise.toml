[tasks."control-plane:outbox-status"]
description = "Inventory control-plane outboxes without reading provider bodies"
run = "bun packages/control-plane/src/cli.ts outbox status --json"

[tasks."control-plane:outbox-prune-dry-run"]
description = "Show conservatively eligible outbox reclaim candidates"
run = "bun packages/control-plane/src/cli.ts outbox prune --dry-run --json"

[tasks."control-plane:outbox-migrate-dry-run"]
description = "Inventory legacy owner metadata without reading outbox bodies"
run = "bun packages/control-plane/src/cli.ts outbox migrate --dry-run --metadata-only --json"

[tasks."remote:review"]
description = "Refresh remote review forwards and open available local URLs"
usage = 'arg "<stream>" help="Remote workspace stream"'
run = 'nu scripts/remote-workspace.nu review "${usage_stream?}"'

[tasks."remote:forward-status"]
description = "Show local forwarding status for one remote stream"
usage = 'arg "<stream>" help="Remote workspace stream"'
run = 'nu scripts/remote-workspace.nu forward status "${usage_stream?}"'

[tasks."remote:forward-restart"]
description = "Restart local forwarding for one remote stream"
usage = 'arg "<stream>" help="Remote workspace stream"'
run = 'nu scripts/remote-workspace.nu forward restart "${usage_stream?}"'

[tasks."remote:forward-down"]
description = "Stop local forwarding for one remote stream"
usage = 'arg "<stream>" help="Remote workspace stream"'
run = 'nu scripts/remote-workspace.nu forward down "${usage_stream?}"'
