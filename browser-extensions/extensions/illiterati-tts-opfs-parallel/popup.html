<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Illiterati</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        width: 760px;
        margin: 0;
        padding: 14px;
        background: #fafafa;
      }

      h3 {
        margin: 0;
      }

      p {
        margin: 8px 0;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #111;
        color: #fff;
        padding: 8px 12px;
        cursor: pointer;
      }

      button.mini {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 6px;
        margin-right: 6px;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .filter-label {
        display: block;
        margin-top: 10px;
        color: #333;
        font-size: 12px;
      }

      #filter-clause {
        margin-top: 4px;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 6px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #status {
        margin-top: 10px;
        color: #333;
        font-size: 12px;
      }

      .clip-table {
        width: 100%;
        margin-top: 10px;
        border-collapse: collapse;
        font-size: 12px;
      }

      .clip-table th,
      .clip-table td {
        border-bottom: 1px solid #ddd;
        text-align: left;
        padding: 6px;
        vertical-align: top;
      }

      .clip-table tr.active {
        background: #ececec;
      }

      #analysis {
        margin-top: 10px;
        background: #111;
        color: #f5f5f5;
        border-radius: 8px;
        padding: 8px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup/main.tsx"></script>
  </body>
</html>
