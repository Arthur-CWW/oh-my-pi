name: OMP Nix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate flake
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixbox, cap-nix]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evaluate every supported system
        run: nix flake check --all-systems --no-build --show-trace
      - name: Verify generated Bun dependencies
        run: nix build --no-link .#checks.x86_64-linux.bun-lock --show-trace
