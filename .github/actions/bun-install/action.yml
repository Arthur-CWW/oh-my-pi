name: "bun install (runner persistent cache)"
description: >
  Ensure pinned bun is on PATH, then run `bun install --frozen-lockfile`.
  Self-hosted runners supply a persistent per-runner BUN_INSTALL_CACHE_DIR,
  which must be preserved unchanged without job-local or actions/cache fallbacks.

runs:
  using: composite
  steps:
    - name: Detect environment and configure runtime
      id: env
      shell: bash
      run: |
        # Export proven temp dirs on self-hosted runners so tools and bun
        # run reliably under DynamicUser / ProtectSystem=strict.
        if [ -n "${RUNNER_TEMP:-}" ]; then
          {
            echo "BUN_TMPDIR=$RUNNER_TEMP"
            echo "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
        fi

        # Verify persistent cache contract when running on self-hosted runner.
        # If the runner environment indicates self-hosted execution but lacks
        # BUN_INSTALL_CACHE_DIR, fail clearly instead of inventing an unshared fallback.
        is_self_hosted=false
        if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
          is_self_hosted=true
        fi

        if [ -n "${BUN_INSTALL_CACHE_DIR:-}" ]; then
          echo "bun cache dir: $BUN_INSTALL_CACHE_DIR (runner persistent cache)"
        elif [ "$is_self_hosted" = "true" ]; then
          echo "::error::BUN_INSTALL_CACHE_DIR is not set on self-hosted runner; refusing to run without persistent runner cache"
          exit 1
        else
          echo "bun cache dir: default (hosted runner)"
        fi

        # bun may be pre-installed on the runner; reuse it only when it matches
        # the repo pin (package.json "packageManager"). A lagging preloaded bun
        # skews version-sensitive codegen and test-runner behavior, so a
        # mismatch fetches the pinned build instead.
        want="$(sed -n 's/.*"packageManager": *"bun@\([^"]*\)".*/\1/p' package.json)"
        if [ -z "$want" ]; then
          echo "::error::could not read pinned bun version from package.json packageManager"
          exit 1
        fi
        echo "bun_version=$want" >> "$GITHUB_OUTPUT"

        have=""
        if command -v bun >/dev/null 2>&1; then
          have="$(bun --version)"
        fi
        if [ "$have" = "$want" ]; then
          echo "setup_bun=false" >> "$GITHUB_OUTPUT"
          echo "bun present: $have (matches pin)"
        else
          echo "setup_bun=true" >> "$GITHUB_OUTPUT"
          echo "bun on runner: ${have:-none}; installing pinned $want"
        fi

    - name: Install pinned bun when missing or mismatched
      if: steps.env.outputs.setup_bun == 'true'
      shell: bash
      run: |
        # On DynamicUser / ProtectSystem=strict runners, $HOME may be read-only or
        # unwritable. Install bun binary into $RUNNER_TEMP when available.
        install_dir="${RUNNER_TEMP:-${HOME}}/.bun"
        export BUN_INSTALL="$install_dir"
        curl -fsSL https://bun.sh/install | bash -s "bun-v${{ steps.env.outputs.bun_version }}"
        echo "${install_dir}/bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      shell: bash
      run: |
        bun install --frozen-lockfile
