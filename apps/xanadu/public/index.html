<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xanadu</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="product-mark">Xanadu</p>
          <h1>Finished artifacts, live from the workstream</h1>
        </div>
        <button id="system-toggle" class="system-toggle" type="button">System log</button>
      </header>

      <section class="control-strip" aria-label="Feed filters">
        <button id="needs-filter" class="filter-button" type="button" aria-pressed="false">Needs Arthur</button>
        <div id="active-filters" class="active-filters" aria-live="polite"></div>
      </section>

      <section id="status" class="status" aria-live="polite">Connecting to the feed.</section>
      <aside id="system-log" class="system-log" aria-label="System log" hidden></aside>
      <section id="feed" class="feed" aria-label="Xanadu feed"></section>
      <template id="empty-template">
        <article class="empty-state">
          <h2>No entries yet</h2>
          <p>Post a proof, question, or demo with <code>bun run post</code> and it will appear here.</p>
        </article>
      </template>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
